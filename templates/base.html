<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Verb Hero{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Navigation bar at the top of every page -->
    <nav>
        <a href="{{ url_for('home') }}" class="nav-logo">⚡ Verb Hero</a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('game_home') }}">🎮 Game</a>
        </div>
    </nav>

    <!-- Each page puts its content here -->
    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
